---
# Inventaire d'EXEMPLE : il n'est PAS déployable.
# Les deux hôtes sont factices et volontairement non résolvables : le TLD
# ".invalid" est réservé, et ses requêtes renvoient toujours NXDOMAIN
# (RFC 6761 §6.4, https://www.rfc-editor.org/rfc/rfc6761#section-6.4).
# Copier ce répertoire HORS du dépôt (-i <inventaire hors dépôt>) et y
# renseigner les vrais noms : un inventaire réel n'est jamais versionné
# (.gitignore ignore inventories/* sauf example/ ; CLAUDE.md §5, D23).
# Le groupe doit contenir EXACTEMENT 2 hôtes (voir CLAUDE.md).
# Nom d'hôte d'inventaire = sortie exacte de « uname -n » sur le nœud (D20,
# garde N7) ; l'adresse SSH peut être donnée par ansible_host.
# pacemaker_node_ip : IPv4 principale du nœud sur pacemaker_vip_nic, sans
# préfixe ; adresse corosync et pcs du nœud (D10, gardes G11 et N7).
all:
  children:
    pacemaker_nodes:
      hosts:
        noeud-factice-1.invalid:
          pacemaker_node_ip: null
        noeud-factice-2.invalid:
          pacemaker_node_ip: null
