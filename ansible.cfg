# Configuration Ansible du projet pacemaker_vip.
#
# ATTENTION : ce fichier n'est lu QUE si ansible est lancé depuis la racine du
# dépôt, que ANSIBLE_CONFIG n'est pas positionné, et que ce répertoire n'est pas
# accessible en écriture à tous. Sinon ~/.ansible.cfg puis
# /etc/ansible/ansible.cfg s'appliquent EN SILENCE.
# Source : ansible-core 2.14.18 lib/ansible/config/manager.py:212-248
# (ordre ANSIBLE_CONFIG, CWD si non world-writable, ~/.ansible.cfg,
# /etc/ansible/ansible.cfg ; premier fichier trouvé, aucune fusion).
# Vérification : `ansible-config dump --only-changed` doit afficher
# CONFIG_FILE() = <racine du dépôt>/ansible.cfg. Garde automatique : L2.
#
# Les variables d'environnement ANSIBLE_* priment sur ce fichier.
# À VÉRIFIER : environnement du contrôleur (`env | grep ^ANSIBLE_`).
#
# Les chemins relatifs sont résolus par rapport au répertoire de CE fichier,
# pas au répertoire courant.
# Source : ansible-core 2.14.18 lib/ansible/config/manager.py:77-78 (basedir = origin),
# lib/ansible/utils/path.py:49-52 (dirname du fichier).

[defaults]
# Collections du projet uniquement : aucune dépendance à /root/.ansible/collections
# ni à /usr/share/ansible/collections, où d'autres versions masqueraient les nôtres.
# Clé `collections_path` (singulier), valable depuis 2.10 ; `collections_paths`
# est encore lue en 2.14.18, sans dépréciation émise (simple TODO).
# Source : ansible-core 2.14.18 lib/ansible/config/base.yml:203-222.
collections_path = ./collections

# Ne pas balayer sys.path : par défaut, sys.path est AJOUTÉ après nos chemins,
# et une collection absente de ./collections y serait trouvée en silence.
# Source : ansible-core 2.14.18 lib/ansible/config/base.yml:194-202 (défaut true),
# lib/ansible/utils/collection_loader/_collection_finder.py:94-98.
collections_scan_sys_path = False

# Erreur fatale (et non avertissement) si une collection chargée déclare un
# requires_ansible incompatible avec la version en cours. Défaut : warning.
# Source : ansible-core 2.14.18 lib/ansible/config/base.yml:223-233,
# lib/ansible/plugins/loader.py:1411-1417.
collections_on_ansible_version_mismatch = error

# Ne pas journaliser les invocations de modules sur la cible
# (ligne « Invoked with <paramètres> » dans syslog/journald). Le rôle ha_cluster
# passe le mot de passe hacluster en stdin de `pcs host auth` sans no_log
# (fedora.linux_system_roles 1.88.9 roles/ha_cluster/tasks/shell_pcs/cluster-auth-pcs-0.10.yml:15).
# Chaîne : no_target_syslog -> _ansible_no_log (lib/ansible/plugins/action/__init__.py:969-970)
# -> AnsibleModule.no_log (lib/ansible/module_utils/common/parameters.py:93)
# -> saut de _log_invocation (lib/ansible/module_utils/basic.py:526-527) et de log()
# (basic.py:1311). Sources : ansible-core 2.14.18.
# LIMITE : n'empêche PAS l'affichage du paramètre dans `invocation` côté
# contrôleur en -vvv (lib/ansible/plugins/callback/__init__.py:234-235).
no_target_syslog = True

# Aucun inventaire par défaut : il doit être passé explicitement avec -i.
# - Sans cette ligne : /etc/ansible/hosts du contrôleur est utilisé
#   (lib/ansible/config/base.yml:729-740, défaut /etc/ansible/hosts).
# - `inventory =` (vide) est PIÉGEUX : la valeur vide est résolue en chemin
#   relatif au répertoire de ce fichier, donc la racine du dépôt est analysée
#   comme inventaire (repro locale, conteneur oraclelinux:9 + RPM
#   ansible-core-2.14.18-3.el9_8.1 : DEFAULT_HOST_LIST = ['<répertoire du cfg>']).
# - /dev/null donne un inventaire vide (même repro). Un -i en ligne de commande
#   le remplace.
inventory = /dev/null
